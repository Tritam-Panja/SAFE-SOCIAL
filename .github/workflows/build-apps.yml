name: Build Desktop (.EXE) & Mobile (.APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS DESKTOP INSTALLER (.EXE)
  # ============================================================================
  build-windows-exe:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 12.21.0
          runtime: node@20

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @fizzy/web run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || 'https://api.fizzykids.safe/api/v1' }}

      - name: Build Electron Installer (.exe)
        run: pnpm exec electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fizzy-windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error

  # ============================================================================
  # 2. ANDROID MOBILE APP (.APK)
  # ============================================================================
  build-android-apk:
    name: Build Android Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 12.21.0
          runtime: node@20

      - name: Set up Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @fizzy/web run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || 'https://api.fizzykids.safe/api/v1' }}

      - name: Sync Capacitor to Native Android Project
        run: |
          cd apps/web
          pnpm exec cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x apps/web/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd apps/web/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fizzy-android-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
