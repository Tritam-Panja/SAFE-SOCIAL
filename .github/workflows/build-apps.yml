name: Build Desktop (.EXE) & Mobile (.APK)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS DESKTOP INSTALLER (.EXE)
  # ============================================================================
  build-windows-exe:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Configure pnpm 12
        shell: pwsh
        run: |
          npm install -g pnpm@12.21.0
          $npmPrefix = npm config get prefix
          "$npmPrefix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared Packages
        run: |
          pnpm --filter @fizzy/shared-types run build
          pnpm --filter @fizzy/validation run build

      - name: Build Web Application
        run: pnpm --filter @fizzy/web run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || 'https://optimization-floral-planners-serves.trycloudflare.com/api/v1' }}

      - name: Build Electron Installer (.exe)
        run: pnpm exec electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fizzy-windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error

  # ============================================================================
  # 2. ANDROID MOBILE APP (.APK)
  # ============================================================================
  build-android-apk:
    name: Build Android Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm 12
        run: |
          npm install -g pnpm@12.21.0
          pnpm --version

      - name: Set up Java JDK (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared Packages
        run: |
          pnpm --filter @fizzy/shared-types run build
          pnpm --filter @fizzy/validation run build

      - name: Build Web Application
        run: pnpm --filter @fizzy/web run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || 'https://optimization-floral-planners-serves.trycloudflare.com/api/v1' }}

      - name: Sync Capacitor to Native Android Project
        run: |
          cd apps/web
          npx --yes @capacitor/cli@8.6.2 sync android --inline

      - name: Make Gradle Wrapper Executable
        run: chmod +x apps/web/android/gradlew

      - name: Build Android Debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: |
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk ./Fizzy-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fizzy-android-apk
          path: Fizzy-Android.apk
          if-no-files-found: error

  # ============================================================================
  # 3. PUBLISH GITHUB RELEASE (DIRECT DOWNLOAD FOR ANY PHONE OR PC)
  # ============================================================================
  publish-release:
    name: Publish Public GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-exe, build-android-apk]
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: fizzy-windows-installer
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: fizzy-android-apk
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Fizzy Downloadable Apps (Latest)"
          body: |
            ### 🚀 Fizzy Latest Downloads

            Download and install Fizzy directly on your devices:

            - 📱 **Android Phone App (.apk):** [Download Fizzy-Android.apk](https://github.com/Tritam-Panja/SAFE-SOCIAL/releases/download/latest/Fizzy-Android.apk)
            - 💻 **Windows Desktop (.exe):** Download the `.exe` installer below.

            *On Android: Open the downloaded APK file and tap "Install" (allow "Unknown sources" or "Install unknown apps" if prompted).*
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
